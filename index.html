<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Mini Strikers</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<section id="menu" class="scr on">
  <h1>Mini Strikers</h1>
  <input id="nome" maxlength="12" placeholder="Seu nome">
  <button id="bOn">Modo Online</button>
  <button id="bLoc">Modo Local</button>
  <p class="hint">Online: 2 a 8 jogadores em salas, de qualquer dispositivo (PC e celular juntos) · Local: 2 jogadores no mesmo teclado</p>
</section>

<section id="online" class="scr">
  <h2>Modo Online</h2>
  <button id="bCriar">Criar sala</button>
  <div class="row"><input id="cod" maxlength="4" placeholder="CÓDIGO"><button id="bEntrar">Entrar</button></div>
  <button class="ghost" data-menu>Voltar</button>
</section>

<section id="lobby" class="scr">
  <h2>Sala <b id="sala"></b></h2>
  <ul id="lista"></ul>
  <button id="bIni">Iniciar jogo</button>
  <p id="espera"></p>
  <button class="ghost" data-menu>Sair</button>
</section>

<section id="jogo" class="scr">
  <div id="placar"><span id="s0" class="t0">0</span><i>VS</i><span id="s1" class="t1">0</span></div>
  <canvas id="cv" width="1000" height="560"></canvas>
  <div id="info"></div><div id="rot">📱 Gire o celular para jogar na horizontal</div>
  <button id="kick">CHUTAR</button>
  <div id="fim"><h2 id="vence"></h2><button id="bRev">Revanche</button><button class="ghost" data-menu>Menu</button></div>
  <p class="hint" id="ajuda"></p>
</section>

<div id="toast"></div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="script.js"></script>
</body>
</html>
